name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        include:
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        exclude:
          # Laravel 11 does not support PHP 8.5.
          - laravel: '11'
            php: '8.5'
          # Laravel 13 requires PHP 8.3+.
          - laravel: '13'
            php: '8.2'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      # Every Laravel 11 release has unpatched security advisories (end of
      # security support), so Composer refuses to install it by default.
      - if: matrix.laravel == '11'
        run: composer config policy.advisories.block false

      - run: composer update --no-interaction --prefer-dist -W --with "orchestra/testbench:^${{ matrix.testbench }}.0"

      - run: vendor/bin/phpunit

  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            username: root
          - db: pgsql
            port: 5432
            username: postgres

    name: PHP 8.5 - Laravel 13 - ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: indoregion
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: indoregion
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - run: composer update --no-interaction --prefer-dist

      - run: vendor/bin/phpunit
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: indoregion
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: secret
